name: Build AI Arena

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build AI Arena
        run: python -m PyInstaller --onedir --windowed --name AI-Arena main.py

      - name: Create ZIP
        shell: pwsh
        run: Compress-Archive -Path dist/AI-Arena -DestinationPath dist/AI-Arena-windows.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Arena-windows
          path: dist/AI-Arena-windows.zip
          if-no-files-found: error

      - name: Create GitHub release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AI-Arena-windows.zip
          generate_release_notes: true
