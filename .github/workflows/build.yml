name: Build AI Arena

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Check project files
        shell: pwsh
        run: |
          Write-Host "Project files:"
          Get-ChildItem -Recurse -File | Select-Object FullName

          if (!(Test-Path "main.py")) {
            throw "main.py was not found"
          }

      - name: Build AI Arena
        run: |
          python -m PyInstaller `
            --onedir `
            --windowed `
            --clean `
            --name AI-Arena `
            main.py

      - name: Verify executable
        shell: pwsh
        run: |
          $exe = "dist/AI-Arena/AI-Arena.exe"

          if (!(Test-Path $exe)) {
            throw "AI-Arena.exe was not created"
          }

          $file = Get-Item $exe

          Write-Host "Executable found:"
          Write-Host $file.FullName
          Write-Host "Size: $($file.Length) bytes"

          if ($file.Length -lt 100000) {
            throw "Executable appears to be suspiciously small"
          }

      - name: Create ZIP
        shell: pwsh
        run: |
          $source = "dist/AI-Arena"
          $zip = "dist/AI-Arena-windows.zip"

          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }

          Compress-Archive `
            -Path "$source/*" `
            -DestinationPath $zip `
            -CompressionLevel Optimal

      - name: Verify ZIP
        shell: pwsh
        run: |
          $zip = "dist/AI-Arena-windows.zip"

          if (!(Test-Path $zip)) {
            throw "ZIP file was not created"
          }

          $file = Get-Item $zip

          Write-Host "ZIP created:"
          Write-Host $file.FullName
          Write-Host "Size: $($file.Length) bytes"

          if ($file.Length -lt 100000) {
            throw "ZIP appears to be suspiciously small"
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem

          $archive = $null

          try {
            $archive = [System.IO.Compression.ZipFile]::OpenRead(
              (Resolve-Path $zip)
            )

            Write-Host "ZIP contains $($archive.Entries.Count) files"

            if ($archive.Entries.Count -lt 2) {
              throw "ZIP contains too few files"
            }
          }
          finally {
            if ($archive -ne $null) {
              $archive.Dispose()
            }
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Arena-windows
          path: dist/AI-Arena-windows.zip
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AI-Arena-windows.zip
          generate_release_notes: true
          name: AI Arena ${{ github.ref_name }}